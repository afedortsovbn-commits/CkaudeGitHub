global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']
  # NATS: метрики через prometheus-nats-exporter — добавить при развитии мониторинга.
