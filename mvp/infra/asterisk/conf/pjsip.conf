; Узел медиасервера (02-архитектура 8.1). Все SIP-потоки идут через Kamailio; узел наружу не открыт.
; Два типа endpoint: операторский/браузерный (WebRTC: DTLS-SRTP, ICE, Opus) и транковый (RTP, G.711).
; Kamailio помечает запросы из браузеров заголовком X-Leg: webrtc — по нему выбирается endpoint.

[global]
type = global
user_agent = cc-media-__NODE_NAME__
endpoint_identifier_order = header,ip

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
__EXTERNAL_ADDRESS__

[webrtc]
type = endpoint
context = from-webrtc
disallow = all
allow = opus,alaw,ulaw
webrtc = yes
dtls_auto_generate_cert = yes
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = no
trust_id_inbound = yes
send_pai = yes
identify_by = header
transport = transport-udp
max_audio_streams = 1
; Браузер шлёт RTP непрерывно (и при удержании, и с выключенным микрофоном): тишина 30 с — вкладка закрыта
; или сеть пропала, вызов завершается, а не висит.
rtp_timeout = 30

[trunk]
type = endpoint
context = from-trunk
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
rtp_symmetric = yes
force_rport = yes
trust_id_inbound = yes
send_pai = yes
identify_by = ip
transport = transport-udp

[webrtc-leg]
type = identify
endpoint = webrtc
match_header = X-Leg: webrtc

; Остальное — от Kamailio: транк, генератор вызовов SIPp.
[kamailio]
type = identify
endpoint = trunk
match = 0.0.0.0/0
