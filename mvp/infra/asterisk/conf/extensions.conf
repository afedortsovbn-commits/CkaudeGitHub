; Диалплан не содержит логики IVR и очередей: всё — в call-control через ARI («конфигурация как данные»,
; 02-архитектура 6.4). Здесь только передача вызова в приложение Stasis «cc».
[general]
static = yes
writeprotect = yes

[from-trunk]
exten => _[+0-9a-zA-Z*#].,1,Set(CC_LEG=trunk)
 same => n,Set(CC_DID=${EXTEN})
 same => n,Goto(cc-stasis,s,1)

[from-webrtc]
exten => _[+0-9a-zA-Z*#].,1,Set(CC_LEG=webrtc)
 same => n,Set(CC_DID=${EXTEN})
 same => n,Goto(cc-stasis,s,1)

; Пока call-control переключается (активный экземпляр отдал аренду узла, резервный ещё подключается к ARI),
; приложение «cc» не зарегистрировано и Stasis() возвращает FAILED. Вызов не сбрасываем: повторяем до 15 с
; (02-архитектура 6.3 — пауза при переключении ≤ 3 с, аварийное — до 6–8 с).
[cc-stasis]
exten => s,1,Set(CC_TRIES=0)
 same => n(retry),Stasis(cc,${CC_LEG},${CC_DID})
 same => n,GotoIf($["${STASISSTATUS}" != "FAILED"]?done)
 same => n,Set(CC_TRIES=$[${CC_TRIES} + 1])
 same => n,GotoIf($[${CC_TRIES} > 60]?done)
 same => n,Wait(0.25)
 same => n,Goto(retry)
 same => n(done),Hangup()
