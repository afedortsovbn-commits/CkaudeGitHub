# Маршруты и промежуточные обработчики Traefik задаются здесь, а НЕ метками контейнеров.
# Причина: во время поэтапного обновления старые и новые контейнеры работают одновременно; если их
# метки маршрутов различаются, Traefik считает это конфликтом и снимает маршрут (ответы 404).
# Метки контейнеров описывают только сервис: порт и проверку готовности (они не меняются между версиями).
http:
  routers:
    api:
      rule: PathPrefix(`/api`)
      entryPoints: [websecure]
      tls: {}
      service: api@docker
      middlewares: [retry]
    # Webhook Telegram-ботов (режим webhook): https://<адрес>/tg/<id канала>.
    telegram-webhook:
      rule: PathPrefix(`/tg/`)
      entryPoints: [websecure]
      tls: {}
      service: connector-telegram@docker
      middlewares: [retry]
    realtime:
      rule: PathPrefix(`/ws`)
      entryPoints: [websecure]
      tls: {}
      service: realtime@docker
    web:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints: [websecure]
      tls: {}
      service: web@docker
      middlewares: [retry]
  middlewares:
    # Повтор только при сетевой ошибке до получения ответа (например, соединение закрыто остановленным экземпляром).
    retry:
      retry:
        attempts: 3
        initialInterval: 50ms
