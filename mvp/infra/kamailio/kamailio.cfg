#!KAMAILIO
#
# SIP-периметр контакт-центра (02-архитектура 8.1).
# - Браузеры (софтфон оператора, демо-страница «Позвонить») — SIP over WSS на отдельном порту 8443,
#   в обход Traefik: перезапуск Traefik не сбрасывает регистрации.
# - Операторы регистрируются короткоживущими учётными данными (auth_ephemeral, схема TURN REST API):
#   пароль выдаёт api перед входом, постоянных SIP-паролей нет.
# - Узлы Asterisk — dispatcher (набор 1). Осушение узла при обновлении: ops/update-media.sh переводит
#   его в состояние «disabled» — новые вызовы идут на другие узлы, идущие разговоры доживают.
# - Все SIP-потоки идут через Kamailio: транк → узел Asterisk; узел → оператор (WSS); узел → транк.
# Шаблон: __SIP_DOMAIN__, __SIP_SECRET__, __TRUNK_HOST__ подставляет entrypoint.sh.

#!define FLT_NATS 5
#!define FLB_NATB 6
#!define DS_MEDIA "1"

####### Глобальные параметры #########
debug=1
log_stderror=yes
memdbg=5
memlog=5
children=4
auto_aliases=no
alias="__SIP_DOMAIN__"
# Адрес интерфейса, а не 0.0.0.0: он попадает в Record-Route, по нему идут запросы внутри диалога.
listen=udp:__LISTEN_IF__:5060
listen=tls:__LISTEN_IF__:8443
enable_tls=yes
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=10
tcp_keepcnt=3
server_header="Server: cc-sip"
user_agent_header="User-Agent: cc-sip"

####### Модули #########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "nathelper.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "auth.so"
loadmodule "auth_ephemeral.so"
loadmodule "dispatcher.so"

modparam("jsonrpcs", "pretty_format", 1)
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")
modparam("tls", "config", "/etc/kamailio/tls.cfg")
# RPM собран с OpenSSL 3.2, в AlmaLinux 9 — 3.5: ABI OpenSSL 3.x совместим, строгую проверку версии снимаем.
modparam("tls", "tls_force_run", 1)
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 0)
# Регистрации — в памяти: браузер при переподключении WSS (в т.ч. после перезапуска Kamailio) регистрируется
# заново, а новые короткоживущие учётные данные всё равно не пережили бы перезапуск в БД.
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "nat_bflag", FLB_NATB)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_interval", 20)
modparam("auth_ephemeral", "secret", "__SIP_SECRET__")
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_interval", 5)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 2)
modparam("dispatcher", "ds_ping_from", "sip:dispatcher@__SIP_DOMAIN__")
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404")

####### Маршрутизация #########
request_route {
	route(REQINIT);

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	route(NATDETECT);
	route(WITHINDLG);

	remove_hf("Route");
	# Метку направления ставит только Kamailio — пришедшую извне не доверяем.
	remove_hf("X-Leg");
	if (is_method("INVITE|SUBSCRIBE|REFER")) {
		record_route();
	}

	if (is_method("REGISTER")) {
		route(REGISTRAR);
	}
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "OK");
		exit;
	}
	if (!is_method("INVITE|MESSAGE|OPTIONS")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}
	if ($rU == $null) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	# От узла Asterisk: вызов оператору/демо-абоненту в браузер (WSS) либо наружу в транк.
	if (ds_is_from_list(DS_MEDIA)) {
		if ($rU =~ "^(op|demo)-") {
			route(TO_BROWSER);
		}
		route(TO_TRUNK);
	}

	# Из браузера: оператор (исходящий вызов) или демо-абонент — только после проверки учётных данных.
	if ($pr == "ws" || $pr == "wss") {
		route(AUTH);
		append_hf("X-Leg: webrtc\r\n");
		route(TO_MEDIA);
	}

	# Транк (и генератор вызовов SIPp в тестах) → узел медиасервера.
	route(TO_MEDIA);
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "некорректный SIP-запрос от $si:$sp\n");
		exit;
	}
}

route[NATDETECT] {
	force_rport();
	# 2|16 — адрес/порт источника не совпадают с Via, 64 — клиент по WebSocket. Проверку «частный адрес в
	# Contact» (1) не используем: внутри контура все адреса частные.
	if (nat_uac_test("82")) {
		if (is_method("REGISTER")) {
			fix_nated_register();
		} else if (is_first_hop()) {
			set_contact_alias();
		}
		setflag(FLT_NATS);
	}
}

route[WITHINDLG] {
	if (!has_totag()) return;
	if (loose_route()) {
		if (!isdsturiset()) {
			handle_ruri_alias();
		}
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

route[AUTH] {
	if (!($fU =~ "^(op|demo)-")) {
		sl_send_reply("403", "Forbidden");
		exit;
	}
	if (!autheph_check("__SIP_DOMAIN__")) {
		auth_challenge("__SIP_DOMAIN__", "1");
		exit;
	}
	# Имя в учётных данных («срок:op-<id>») должно совпадать с пользователем в From.
	if (!autheph_check_from()) {
		sl_send_reply("403", "Forbidden");
		exit;
	}
	consume_credentials();
}

route[REGISTRAR] {
	if ($pr != "ws" && $pr != "wss") {
		sl_send_reply("403", "Forbidden");
		exit;
	}
	if (!($fU =~ "^op-")) {
		sl_send_reply("403", "Forbidden");
		exit;
	}
	route(AUTH);
	if (isflagset(FLT_NATS)) {
		setbflag(FLB_NATB);
	}
	if (!save("location")) {
		sl_reply_error();
	}
	exit;
}

route[TO_BROWSER] {
	if (!lookup("location")) {
		sl_send_reply("480", "Temporarily Unavailable");
		exit;
	}
	route(RELAY);
	exit;
}

route[TO_MEDIA] {
	# Круговой выбор среди активных узлов; осушаемый (disabled) и недоступный узлы пропускаются.
	if (!ds_select_dst(DS_MEDIA, "4")) {
		sl_send_reply("503", "Service Unavailable");
		exit;
	}
	t_on_failure("MEDIA_FAILOVER");
	route(RELAY);
	exit;
}

route[TO_TRUNK] {
	$var(trunk) = "__TRUNK_HOST__";
	if ($var(trunk) == "") {
		sl_send_reply("503", "No Trunk");
		exit;
	}
	$ru = "sip:" + $rU + "@" + $var(trunk);
	route(RELAY);
	exit;
}

route[RELAY] {
	if (is_method("INVITE|BYE|UPDATE")) {
		if (!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
	}
	if (is_method("INVITE|UPDATE")) {
		if (!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

branch_route[MANAGE_BRANCH] {
	route(NATMANAGE);
}

onreply_route[MANAGE_REPLY] {
	if (status =~ "[12][0-9][0-9]") {
		route(NATMANAGE);
	}
}

route[NATMANAGE] {
	if (is_request()) {
		if (has_totag()) {
			if (check_route_param("nat=yes")) {
				setbflag(FLB_NATB);
			}
		}
	}
	if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) return;
	if (is_request()) {
		if (!has_totag()) {
			if (t_is_branch_route()) {
				add_rr_param(";nat=yes");
			}
		}
	}
	if (is_reply()) {
		if (isbflagset(FLB_NATB)) {
			if (is_first_hop()) {
				set_contact_alias();
			}
		}
	}
}

failure_route[MEDIA_FAILOVER] {
	if (t_is_canceled()) exit;
	if (t_check_status("(408|5[0-9][0-9])") && ds_next_dst()) {
		t_on_failure("MEDIA_FAILOVER");
		route(RELAY);
	}
}

# HTTP → WebSocket (SIP over WSS, RFC 7118) только на порту 8443.
event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();
	if ($Rp != 8443) {
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
		if (ws_handle_handshake()) {
			exit;
		}
	}
	xhttp_reply("404", "Not Found", "", "");
}
