server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /healthz {
    access_log off;
    if (-f /tmp/draining) { return 503; }
    return 200 "ok\n";
  }

  # Ресурсы с хэшем в имени неизменяемы — кэшируются надолго. Ресурсы предыдущей версии хранятся
  # в том же каталоге (Ф11, ops/build-images.sh), поэтому открытые вкладки старой версии не получают 404.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Версия сборки (Ф11): открытые вкладки проверяют её, чтобы предложить обновление (M-OP-11).
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Виджет встраивается на сайты заказчика: имя файла постоянное, поэтому кэш короткий.
  location /widget/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # index.html не кэшируется: новая версия подхватывается при следующей загрузке.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
