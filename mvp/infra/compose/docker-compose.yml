# Контакт-центр MVP — локальное/серверное развёртывание одной командой:
#   ops/build-images.sh && docker compose -f infra/compose/docker-compose.yml up -d
# Профили: (по умолчанию) ядро; observability — Prometheus, Grafana, Loki; test — заглушки Telegram и почты для e2e.
# Прикладные сервисы НЕ имеют container_name и опубликованных портов — иначе невозможны
# масштабирование и поэтапное обновление (ops/rollout.sh, 02-архитектура 6.2).
name: cc

x-nats: &nats
  image: ${NATS_IMAGE:-nats:2.11-alpine}
  restart: unless-stopped
  networks: [cc]
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
    interval: 3s
    timeout: 2s
    retries: 20

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Секрет подписи токенов: на сервере обязательно задать свой (не короче 32 символов) в .env.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  DATABASE_URL: postgres://cc:${POSTGRES_PASSWORD:-cc_dev_password}@postgres:5432/cc
  NATS_SERVERS: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  # Ключ шифрования секретов каналов (токены ботов, пароли почты) в БД: на сервере задать свой в .env
  # (не короче 16 символов). Смена ключа потребует повторного ввода секретов каналов в админке.
  SECRETS_KEY: ${SECRETS_KEY:-dev-only-secrets-key-change-me}

services:
  traefik:
    # v3.6+: корректное согласование версии API с Docker Engine 29+ (v3.5 обращается к API 1.24 и получает отказ).
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cc
      - --providers.docker.defaultRule=Host(`unrouted.invalid`)
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --ping=true
      - --metrics.prometheus=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.format=json
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [cc]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: cc
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc_dev_password}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [cc]
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cc -d cc']
      interval: 2s
      retries: 30

  nats-1:
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-1',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats1:/data]
    ports: ['127.0.0.1:4222:4222']
  nats-2:
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-2',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats2:/data]
    ports: ['127.0.0.1:4223:4222']
  nats-3:
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-3',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats3:/data]
    ports: ['127.0.0.1:4224:4222']

  # S3-совместимое хранилище (записи разговоров, вложения, аудио IVR). SeaweedFS — Apache 2.0,
  # выбран вместо MinIO из-за рисков смены лицензии/политики сборок (В-36).
  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.47}
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-volume.max=0']
    volumes: [s3data:/data]
    networks: [cc]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      retries: 20

  migrate:
    image: cc/api:${API_TAG:-dev}
    environment:
      <<: *app-env
      SERVICE_NAME: bootstrap
      # Миграции + первый администратор + (по желанию) демо-данные.
      ENTRY: dist/cli/bootstrap.js
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@cc.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo12345!}
    networks: [cc]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    healthcheck: { disable: true }

  api:
    image: cc/api:${API_TAG:-dev}
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: api
      NATS_STREAM_REPLICAS: 3
      S3_ENDPOINT: http://s3:8333
      MAX_UPLOAD_MB: 10
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.api.loadbalancer.server.port: '3000'
      traefik.http.services.api.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.api.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 1s

  worker:
    image: cc/worker:${WORKER_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: worker
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }

  router:
    image: cc/router:${ROUTER_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${ROUTER_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: router
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }

  realtime:
    image: cc/realtime:${REALTIME_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${REALTIME_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: realtime
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.realtime.loadbalancer.server.port: '3000'
      traefik.http.services.realtime.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.realtime.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.realtime.loadbalancer.healthcheck.timeout: 1s

  web:
    image: cc/web:${WEB_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    networks: [cc]
    stop_grace_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.services.web.loadbalancer.server.port: '8080'
      traefik.http.services.web.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.web.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.web.loadbalancer.healthcheck.timeout: 1s

  # --- коннекторы каналов (Ф4): ≥2 экземпляра; приём каждого бота/ящика ведёт владелец аренды в NATS KV ---
  connector-telegram:
    image: cc/connector-telegram:${CONNECTOR_TELEGRAM_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CONNECTOR_TELEGRAM_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: connector-telegram
      S3_ENDPOINT: http://s3:8333
      # Внешний адрес КЦ для режима webhook (https://<адрес>/tg/<id канала>); для режима опроса не нужен.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.connector-telegram.loadbalancer.server.port: '3000'
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.timeout: 1s

  connector-email:
    image: cc/connector-email:${CONNECTOR_EMAIL_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CONNECTOR_EMAIL_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: connector-email
      S3_ENDPOINT: http://s3:8333
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }

  # --- профиль test: заглушки внешних систем для e2e (в поставку не входят) ---
  mock-telegram:
    profiles: [test]
    image: cc/mock-telegram:${MOCK_TELEGRAM_TAG:-dev}
    restart: unless-stopped
    networks: [cc]
    ports: ['127.0.0.1:${MOCK_TELEGRAM_PORT:-8081}:3000']
  mail:
    profiles: [test]
    # GreenMail: тестовый SMTP (3025) + IMAP (3143), ящики создаются при первом входе.
    image: ${GREENMAIL_IMAGE:-greenmail/standalone:2.1.5}
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false
    networks: [cc]
    ports: ['127.0.0.1:${MAIL_SMTP_PORT:-3025}:3025', '127.0.0.1:${MAIL_IMAP_PORT:-3143}:3143']

  # --- профиль observability ---
  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    volumes: ['../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    networks: [cc]
    ports: ['127.0.0.1:9090:9090']
  loki:
    profiles: [observability]
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    networks: [cc]
  promtail:
    profiles: [observability]
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.5.3}
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - '../observability/promtail.yml:/etc/promtail/config.yml:ro'
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cc]
  grafana:
    profiles: [observability]
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: ['../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro']
    networks: [cc]
    ports: ['127.0.0.1:3001:3000']

networks:
  cc:
    name: cc

volumes:
  pgdata:
  nats1:
  nats2:
  nats3:
  s3data:
