# Контакт-центр MVP — локальное/серверное развёртывание одной командой:
#   ops/build-images.sh && docker compose -f infra/compose/docker-compose.yml up -d
# Профили: (по умолчанию) ядро; observability — Prometheus, Grafana, Loki; test — заглушки Telegram и почты для e2e.
# Прикладные сервисы НЕ имеют container_name и опубликованных портов — иначе невозможны
# масштабирование и поэтапное обновление (ops/rollout.sh, 02-архитектура 6.2).
name: cc

x-nats: &nats
  image: ${NATS_IMAGE:-nats:2.11-alpine}
  restart: unless-stopped
  networks: [cc]
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
    interval: 3s
    timeout: 2s
    retries: 20

x-asterisk: &asterisk
  image: cc/asterisk:${ASTERISK_TAG:-${MEDIA_TAG:-dev}}
  restart: unless-stopped
  networks: [cc]
  # Остановка узла — только после осушения (ops/update-media.sh): к этому моменту разговоров на нём нет.
  stop_grace_period: 10s

x-coturn: &coturn
  image: ${COTURN_IMAGE:-coturn/coturn:4.7}
  restart: unless-stopped
  networks: [cc]

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Секрет подписи токенов: на сервере обязательно задать свой (не короче 32 символов) в .env.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  DATABASE_URL: postgres://cc:${POSTGRES_PASSWORD:-cc_dev_password}@postgres:5432/cc
  NATS_SERVERS: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  # Ключ шифрования секретов каналов (токены ботов, пароли почты) в БД: на сервере задать свой в .env
  # (не короче 16 символов). Смена ключа потребует повторного ввода секретов каналов в админке.
  SECRETS_KEY: ${SECRETS_KEY:-dev-only-secrets-key-change-me}
  # Телефония (Ф5): общий с Kamailio секрет короткоживущих SIP-паролей операторов, пароль ARI узлов Asterisk,
  # общий с coturn секрет TURN REST API. На сервере — свои значения в .env.
  SIP_SECRET: ${SIP_SECRET:-dev-only-sip-secret-change-me}
  ARI_PASSWORD: ${ARI_PASSWORD:-dev-only-ari-password}
  TURN_SECRET: ${TURN_SECRET:-dev-only-turn-secret-change-me}

# Журналы контейнеров: не больше 3 файлов по 10 МБ на сервис — диск не забивается при работе без перерыва.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  traefik:
    logging: *logging
    # v3.6+: корректное согласование версии API с Docker Engine 29+ (v3.5 обращается к API 1.24 и получает отказ).
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cc
      - --providers.docker.defaultRule=Host(`unrouted.invalid`)
      # Каталог динамической конфигурации: маршруты (dynamic.yml) и TLS (сертификат домена — TRAEFIK_TLS, Ф12).
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --ping=true
      - --metrics.prometheus=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.format=json
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic/routes.yml:ro
      - ${TRAEFIK_TLS:-../traefik/tls-default.yml}:/etc/traefik/dynamic/tls.yml:ro
      - ${TRAEFIK_CERTS_DIR:-../traefik/certs}:/certs:ro
    networks: [cc]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s

  postgres:
    logging: *logging
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: cc
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc_dev_password}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [cc]
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cc -d cc']
      interval: 2s
      retries: 30

  nats-1:
    logging: *logging
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-1',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats1:/data]
    ports: ['127.0.0.1:4222:4222']
  nats-2:
    logging: *logging
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-2',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats2:/data]
    ports: ['127.0.0.1:4223:4222']
  nats-3:
    logging: *logging
    <<: *nats
    command:
      [
        '-js',
        '-sd',
        '/data',
        '-n',
        'nats-3',
        '--cluster_name',
        'cc',
        '--cluster',
        'nats://0.0.0.0:6222',
        '--routes',
        'nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222',
        '-m',
        '8222',
        '--no_advertise',
      ]
    volumes: [nats3:/data]
    ports: ['127.0.0.1:4224:4222']

  # S3-совместимое хранилище (записи разговоров, вложения, аудио IVR). SeaweedFS — Apache 2.0,
  # выбран вместо MinIO из-за рисков смены лицензии/политики сборок (В-36).
  s3:
    logging: *logging
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.47}
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-volume.max=0']
    volumes: [s3data:/data]
    networks: [cc]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      retries: 20

  migrate:
    logging: *logging
    image: cc/api:${API_TAG:-dev}
    environment:
      <<: *app-env
      SERVICE_NAME: bootstrap
      # Миграции + первый администратор + (по желанию) демо-данные.
      ENTRY: dist/cli/bootstrap.js
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@cc.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo12345!}
      # Демо-сценарий IVR (Ф6): аудиофайлы — в S3-хранилище, операции — к моку самообслуживания.
      S3_ENDPOINT: http://s3:8333
      SELFSERVICE_URL: ${SELFSERVICE_URL:-http://mock-selfservice:3000}
      SELFSERVICE_TOKEN: ${MOCK_SELFSERVICE_TOKEN:-demo-selfservice-token}
    networks: [cc]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: 'no'
    healthcheck: { disable: true }

  api:
    logging: *logging
    image: cc/api:${API_TAG:-dev}
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: api
      NATS_STREAM_REPLICAS: 3
      SIP_DOMAIN: ${SIP_DOMAIN:-cc.local}
      # Внешние адреса coturn для браузеров (turn:<адрес>:3478,turn:<адрес>:3479); пусто — без TURN (локальная сеть).
      TURN_URLS: ${TURN_URLS:-}
      DEMO_CALLER_ENABLED: ${SEED_DEMO:-false}
      # Вход в один клик под демо-учётками (страница /demo-login) — только для демо-стенда (ops/demo.sh).
      DEMO_QUICK_LOGIN: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      S3_ENDPOINT: http://s3:8333
      MAX_UPLOAD_MB: 10
      # Адрес системы в описании публичного API (OpenAPI, Ф9).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.api.loadbalancer.server.port: '3000'
      traefik.http.services.api.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.api.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 1s

  worker:
    logging: *logging
    image: cc/worker:${WORKER_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      # Письма 2-й линии (Ф8) — SMTP заказчика; пусто — письма копятся в очереди. В профиле test — GreenMail:
      # TICKET_SMTP_HOST=mail TICKET_SMTP_PORT=3025.
      SMTP_HOST: ${TICKET_SMTP_HOST:-}
      SMTP_PORT: ${TICKET_SMTP_PORT:-25}
      SMTP_SECURE: ${TICKET_SMTP_SECURE:-false}
      SMTP_USER: ${TICKET_SMTP_USER:-}
      SMTP_PASSWORD: ${TICKET_SMTP_PASSWORD:-}
      SMTP_FROM: ${TICKET_SMTP_FROM:-Контакт-центр <cc@cc.local>}
      # Адрес системы для ссылок в письмах и в ходе внешнего бота (replyUrl).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      # Webhooks (Ф9): потолок задержки повтора (с) и срок ожидания восстановления получателя (ч).
      WEBHOOK_MAX_BACKOFF_S: ${WEBHOOK_MAX_BACKOFF_S:-300}
      WEBHOOK_MAX_AGE_H: ${WEBHOOK_MAX_AGE_H:-72}
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }

  router:
    logging: *logging
    image: cc/router:${ROUTER_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${ROUTER_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: router
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }

  realtime:
    logging: *logging
    image: cc/realtime:${REALTIME_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${REALTIME_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: realtime
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.realtime.loadbalancer.server.port: '3000'
      traefik.http.services.realtime.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.realtime.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.realtime.loadbalancer.healthcheck.timeout: 1s

  web:
    logging: *logging
    image: cc/web:${WEB_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    networks: [cc]
    stop_grace_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.services.web.loadbalancer.server.port: '8080'
      traefik.http.services.web.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.web.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.web.loadbalancer.healthcheck.timeout: 1s

  # --- коннекторы каналов (Ф4): ≥2 экземпляра; приём каждого бота/ящика ведёт владелец аренды в NATS KV ---
  connector-telegram:
    logging: *logging
    image: cc/connector-telegram:${CONNECTOR_TELEGRAM_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CONNECTOR_TELEGRAM_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: connector-telegram
      S3_ENDPOINT: http://s3:8333
      # Внешний адрес КЦ для режима webhook (https://<адрес>/tg/<id канала>); для режима опроса не нужен.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }
    labels:
      traefik.enable: 'true'
      traefik.http.services.connector-telegram.loadbalancer.server.port: '3000'
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.connector-telegram.loadbalancer.healthcheck.timeout: 1s

  connector-email:
    logging: *logging
    image: cc/connector-email:${CONNECTOR_EMAIL_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CONNECTOR_EMAIL_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: connector-email
      S3_ENDPOINT: http://s3:8333
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      s3: { condition: service_healthy }

  # Ф13: отзывы с карт через Rocket Data (M-CH-10). Опрос ведёт владелец аренды, ответы доставляют оба экземпляра.
  connector-rocketdata:
    logging: *logging
    image: cc/connector-rocketdata:${CONNECTOR_ROCKETDATA_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CONNECTOR_ROCKETDATA_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: connector-rocketdata
      # Выход в интернет из контура — только к сервису ответов Rocket Data, через прокси (пусто — напрямую).
      HTTPS_PROXY: ${ROCKETDATA_PROXY:-}
      HTTP_PROXY: ${ROCKETDATA_PROXY:-}
      NO_PROXY: ${ROCKETDATA_NO_PROXY:-localhost,127.0.0.1,mock-selfservice}
      NODE_USE_ENV_PROXY: '1'
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
    # Приём отзывов от Rocket Data: https://<адрес>/rd/<id канала> (маршрут — infra/traefik/dynamic.yml).
    labels:
      traefik.enable: 'true'
      traefik.http.services.connector-rocketdata.loadbalancer.server.port: '3000'
      traefik.http.services.connector-rocketdata.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.connector-rocketdata.loadbalancer.healthcheck.interval: 1s
      traefik.http.services.connector-rocketdata.loadbalancer.healthcheck.timeout: 1s

  # --- телефония (Ф5): Kamailio (SIP-периметр), Asterisk ×2 (медиа), coturn ×2 (TURN) ---
  kamailio:
    logging: *logging
    image: cc/kamailio:${KAMAILIO_TAG:-${MEDIA_TAG:-dev}}
    restart: unless-stopped
    environment:
      SIP_SECRET: ${SIP_SECRET:-dev-only-sip-secret-change-me}
      SIP_DOMAIN: ${SIP_DOMAIN:-cc.local}
      MEDIA_NODES: asterisk-1:5060 asterisk-2:5060
      # Имя/адрес Kamailio в Record-Route (переживает пересоздание контейнера); на сервере с внешним транком —
      # внешний адрес, по которому транк достигает Kamailio.
      SIP_ADVERTISE: ${SIP_ADVERTISE:-kamailio}
      # SIP-транки оператора связи (МТС) для исходящих: «хост:порт;приоритет» через запятую (1 — основной, остальные —
      # резерв при отказе или молчании); TRUNK_HOST — один транк (как раньше). Пусто — исходящие наружу недоступны.
      TRUNKS: ${TRUNKS:-}
      TRUNK_HOST: ${TRUNK_HOST:-}
      # Адреса/сети SIP-транка, с которых принимаются входящие (через запятую); пусто — любые (демо-стенд).
      TRUNK_ALLOW: ${TRUNK_ALLOW:-}
    networks: [cc]
    # WSS для браузеров — отдельный порт в обход Traefik (02-архитектура 8.1); 5060/udp — приём транка.
    ports: ['${SIP_WSS_PORT:-8443}:8443', '${SIP_UDP_PORT:-5060}:5060/udp']
    volumes: ['sipcerts:/etc/kamailio/tls']
    depends_on:
      asterisk-1: { condition: service_healthy }
      asterisk-2: { condition: service_healthy }

  # Управление вызовами (ARI): на каждый узел Asterisk — активный экземпляр (аренда в NATS KV) и резервный.
  call-control:
    logging: *logging
    image: cc/call-control:${CALL_CONTROL_TAG:-${API_TAG:-dev}}
    restart: unless-stopped
    deploy:
      replicas: ${CALL_CONTROL_REPLICAS:-2}
    environment:
      <<: *app-env
      SERVICE_NAME: call-control
      MEDIA_NODES: asterisk-1,asterisk-2
      SIP_PROXY: kamailio:5060
      S3_ENDPOINT: http://s3:8333
    networks: [cc]
    stop_grace_period: 35s
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      asterisk-1: { condition: service_healthy }
      asterisk-2: { condition: service_healthy }

  asterisk-1:
    logging: *logging
    <<: *asterisk
    environment:
      NODE_NAME: asterisk-1
      ARI_PASSWORD: ${ARI_PASSWORD:-dev-only-ari-password}
      RTP_START: 10000
      RTP_END: 10199
      EXTERNAL_ADDRESS: ${MEDIA_EXTERNAL_ADDRESS:-}
    volumes: ['ast1spool:/var/spool/asterisk']

  asterisk-2:
    logging: *logging
    <<: *asterisk
    environment:
      NODE_NAME: asterisk-2
      ARI_PASSWORD: ${ARI_PASSWORD:-dev-only-ari-password}
      RTP_START: 10200
      RTP_END: 10399
      EXTERNAL_ADDRESS: ${MEDIA_EXTERNAL_ADDRESS:-}
    volumes: ['ast2spool:/var/spool/asterisk']

  # TURN для удалённых операторов за NAT; учётные данные — короткоживущие (TURN REST API), выдаёт api
  # перед каждым вызовом, поэтому экземпляр можно вывести из списка и обновить без обрыва (02-архитектура 6.5).
  coturn-1:
    logging: *logging
    <<: *coturn
    command: [
        '-n',
        '--listening-port=3478',
        '--use-auth-secret',
        '--static-auth-secret=${TURN_SECRET:-dev-only-turn-secret-change-me}',
        '--realm=${SIP_DOMAIN:-cc.local}',
        '--min-port=49160',
        '--max-port=49199',
        '--no-cli',
        '--no-tls',
        '--no-dtls',
        '--log-file=stdout',
        '--simple-log',
        # Метрики (turn_total_allocations) — ops/update-media.sh coturn-N ждёт по ним завершения сессий.
        '--prometheus',
      ]
    ports: ['${TURN1_PORT:-3478}:3478/udp', '${TURN1_PORT:-3478}:3478/tcp']
  coturn-2:
    logging: *logging
    <<: *coturn
    command: [
        '-n',
        '--listening-port=3478',
        '--use-auth-secret',
        '--static-auth-secret=${TURN_SECRET:-dev-only-turn-secret-change-me}',
        '--realm=${SIP_DOMAIN:-cc.local}',
        '--min-port=49200',
        '--max-port=49239',
        '--no-cli',
        '--no-tls',
        '--no-dtls',
        '--log-file=stdout',
        '--simple-log',
        # Метрики (turn_total_allocations) — ops/update-media.sh coturn-N ждёт по ним завершения сессий.
        '--prometheus',
      ]
    ports: ['${TURN2_PORT:-3479}:3478/udp', '${TURN2_PORT:-3479}:3478/tcp']

  # --- профиль test: заглушки внешних систем для e2e (в поставку не входят) ---
  mock-telegram:
    logging: *logging
    profiles: [test]
    image: cc/mock-telegram:${MOCK_TELEGRAM_TAG:-dev}
    restart: unless-stopped
    networks: [cc]
    ports: ['127.0.0.1:${MOCK_TELEGRAM_PORT:-8081}:3000']
  # Мок внешней системы самообслуживания (баланс бонусов, история заправок) — демо-сценарий IVR и панель
  # внешних данных клиента (Ф6), LLM (Ф7), приёмник webhooks, анализатор и внешний бот (Ф9). Профили test и demo.
  mock-selfservice:
    logging: *logging
    profiles: [test, demo]
    image: cc/mock-selfservice:${MOCK_SELFSERVICE_TAG:-${MOCK_TELEGRAM_TAG:-dev}}
    restart: unless-stopped
    environment:
      MOCK_TOKEN: ${MOCK_SELFSERVICE_TOKEN:-demo-selfservice-token}
      # Ф9: демо-анализатор и внешний бот вызывают публичный API (ключи демо-стенда — как в сиде api).
      API_URL: http://api:3000
    networks: [cc]
    # Управление приёмником webhooks из e2e (POST /control, GET /hooks/<имя>).
    ports: ['127.0.0.1:${MOCK_SELFSERVICE_PORT:-8082}:3000']
  mail:
    logging: *logging
    profiles: [test]
    # GreenMail: тестовый SMTP (3025) + IMAP (3143), ящики создаются при первом входе.
    image: ${GREENMAIL_IMAGE:-greenmail/standalone:2.1.5}
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose=false
    networks: [cc]
    ports: ['127.0.0.1:${MAIL_SMTP_PORT:-3025}:3025', '127.0.0.1:${MAIL_IMAP_PORT:-3143}:3143']
  # Имитация SIP-транка оператора связи для исходящих вызовов (SIPp UAS: отвечает и ждёт BYE).
  trunk-sim:
    logging: *logging
    profiles: [test]
    image: ${SIPP_IMAGE:-ctaloi/sipp:latest}
    restart: unless-stopped
    command: ['-sn', 'uas', '-p', '5060', '-trace_err']
    networks: [cc]

  # --- профиль observability ---
  prometheus:
    logging: *logging
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    volumes: ['../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    networks: [cc]
    ports: ['127.0.0.1:9090:9090']
  loki:
    logging: *logging
    profiles: [observability]
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    networks: [cc]
  promtail:
    logging: *logging
    profiles: [observability]
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.5.3}
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - '../observability/promtail.yml:/etc/promtail/config.yml:ro'
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cc]
  grafana:
    logging: *logging
    profiles: [observability]
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: ['../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro']
    networks: [cc]
    ports: ['127.0.0.1:3001:3000']

networks:
  cc:
    name: cc

volumes:
  sipcerts:
  ast1spool:
  ast2spool:
  pgdata:
  nats1:
  nats2:
  nats3:
  s3data:
