<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-сайт с чатом</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
    </style>
  </head>
  <body>
    <h1>Демо-сайт сети АЗС</h1>
    <p>Страница-пример встраивания виджета. Код для сайта:</p>
    <pre>
&lt;script src="https://&lt;адрес-кц&gt;/widget/widget.js" data-key="demo-webchat" async&gt;&lt;/script&gt;</pre
    >
    <p>
      Другой канал — параметр <code>?key=</code>, например
      <a href="?key=demo-webchat-bot">чат с ботом (demo-webchat-bot)</a>.
    </p>
    <script>
      // Ключ канала из адреса страницы (?key=…), по умолчанию — demo-webchat.
      const s = document.createElement('script');
      s.src = './widget.js';
      s.dataset.key = new URLSearchParams(location.search).get('key') || 'demo-webchat';
      document.body.appendChild(s);
    </script>
  </body>
</html>
