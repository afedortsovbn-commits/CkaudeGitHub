<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо-сайт с чатом</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312b886'/%3E%3Cpath d='M8 10h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-9l-5 4v-4H8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z' fill='white'/%3E%3C/svg%3E" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
    </style>
  </head>
  <body>
    <h1>Демо-сайт сети АЗС</h1>
    <p>Страница-пример встраивания виджета. Код для сайта:</p>
    <pre>
&lt;script src="https://&lt;адрес-кц&gt;/widget/widget.js" data-key="demo-webchat" async&gt;&lt;/script&gt;</pre
    >
    <p>
      Другой канал — параметр <code>?key=</code>, например
      <a href="?key=demo-webchat-bot">чат с ботом (demo-webchat-bot)</a>.
    </p>
    <script>
      // Ключ канала из адреса страницы (?key=…), по умолчанию — demo-webchat.
      const s = document.createElement('script');
      s.src = './widget.js';
      s.dataset.key = new URLSearchParams(location.search).get('key') || 'demo-webchat';
      document.body.appendChild(s);
    </script>
  </body>
</html>
