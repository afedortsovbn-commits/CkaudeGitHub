name: mvp

on:
  push:
    branches: [main]
    paths: ["mvp/**", ".github/workflows/mvp.yml"]
  pull_request:
    paths: ["mvp/**", ".github/workflows/mvp.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mvp

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cc, POSTGRES_PASSWORD: cc, POSTGRES_DB: cc }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://cc:cc@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: mvp/package.json }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: mvp/pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Лицензии зависимостей
        run: pnpm licenses:check
      - name: Базовая ревизия для сверки (ветка PR или предыдущий коммит main)
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if [ "${{ github.event_name }}" = push ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}" && echo "COMPAT_BASE=${{ github.event.before }}" >> "$GITHUB_ENV" \
              || echo "COMPAT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            echo "COMPAT_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          fi
      - name: Правило expand/contract для миграций (и неизменность выпущенных)
        run: pnpm migrations:lint --base "$COMPAT_BASE"
      - name: Совместимость контрактов событий и OpenAPI с базовой ревизией — только аддитивные изменения
        run: pnpm test:ops && pnpm compat:check --base "$COMPAT_BASE"
      - name: Squawk (безопасность миграций PostgreSQL)
        run: npx --yes squawk-cli@2 --assume-in-transaction --exclude=prefer-robust-stmts,require-timeout-settings,prefer-bigint-over-int,prefer-bigint-over-smallint,adding-foreign-key-constraint,require-concurrent-index-creation packages/db/migrations/*.sql

  stack:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      SEED_DEMO: "true"
      BOOTSTRAP_ADMIN_PASSWORD: Admin12345!
      # Заглушки внешних систем для e2e (мок Telegram Bot API, GreenMail) и адрес webhook изнутри контура.
      COMPOSE_PROFILES: test
      MOCK_TELEGRAM_TAG: v1
      PUBLIC_BASE_URL: https://traefik
      # Имитация SIP-транка (SIPp UAS) для исходящих вызовов в e2e Ф5.
      TRUNK_HOST: trunk-sim:5060
      # Письма 2-й линии (Ф8) — в GreenMail.
      TICKET_SMTP_HOST: mail
      TICKET_SMTP_PORT: "3025"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: mvp/package.json }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: mvp/pnpm-lock.yaml,
          }
      - run: APPS="api worker router realtime call-control connector-telegram connector-email web mock-telegram mock-selfservice" ops/build-images.sh v1 && SKIP_MEDIA=1 ops/build-images.sh v2
      - run: API_TAG=v1 docker compose -f infra/compose/docker-compose.yml up -d --wait
      - name: Сквозные тесты в браузере (Playwright)
        run: |
          cd e2e && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - name: Поэтапное обновление api под нагрузкой — 0 ошибок
        run: API_TAG=v1 node ops/test/rollout-under-load.mjs v2 50 60
      - name: Поэтапное обновление web под нагрузкой — 0 ошибок
        run: API_TAG=v2 SERVICE=web node ops/test/rollout-under-load.mjs v2 40 30
      - name: Переписка во время обновления api, worker и realtime — без потерь и дублей
        run: API_TAG=v2 node ops/test/chat-under-rollout.mjs v2 60
      - name: Внешний канал и webhooks во время обновления api и worker — без потерь и дублей
        run: API_TAG=v2 node ops/test/webhooks-under-rollout.mjs v2 60
      - name: Поток Telegram и email во время обновления коннекторов — без потерь и дублей
        run: API_TAG=v2 node ops/test/connectors-under-rollout.mjs v2 60
      - name: Обновление Asterisk осушением узлов во время ~10 разговоров SIPp — 0 обрывов
        run: API_TAG=v2 node ops/test/calls-under-update.mjs media
      - name: Переключение call-control (активный → резервный) во время разговоров — 0 обрывов
        run: API_TAG=v2 node ops/test/calls-under-update.mjs call-control v2
      - name: Штатная смена активного call-control во время IVR — сценарии продолжаются, пауза ≤ 3 с
        run: node ops/test/ivr-under-switch.mjs graceful
      - name: Аварийная смена активного call-control (kill) во время IVR — сценарии продолжаются, пауза ≤ 8 с
        run: node ops/test/ivr-under-switch.mjs kill
      - name: Распределение обращений во время обновления router — без потерь
        run: API_TAG=v2 node ops/test/route-under-rollout.mjs v2
      - name: Перезапуск узла NATS — без потерь
        run: node ops/test/nats-failover.mjs 2000
      - name: Перезапуск Kamailio во время разговора — разговор продолжается и корректно завершается (BYE в обе стороны)
        run: API_TAG=v2 node ops/test/kamailio-restart.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          {
            name: e2e-results,
            path: mvp/e2e/test-results,
            if-no-files-found: ignore,
          }
      - if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --no-color | tail -300

  # Автотест «обновление под нагрузкой» (02-архитектура 6.8, Ф11): версия базовой ветки (N) под нагрузкой
  # 10 операторов / 30 вызовов / 100 чатов обновляется до версии PR (N+1) выпуском ops/release.sh и осушением медиа.
  zero-downtime:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SEED_DEMO: "true"
      BOOTSTRAP_ADMIN_PASSWORD: Admin12345!
      COMPOSE_PROFILES: test
      PUBLIC_BASE_URL: https://traefik
      TRUNK_HOST: trunk-sim:5060
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: mvp/package.json }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: mvp/pnpm-lock.yaml,
          }
      - name: Версия N — базовая ветка
        run: |
          BASE="${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}"
          git fetch --no-tags --depth=1 origin "${BASE#origin/}"
          git worktree add /tmp/base FETCH_HEAD
          cd /tmp/base/mvp && pnpm install --frozen-lockfile
          APPS="api worker router realtime call-control connector-telegram connector-email web mock-telegram mock-selfservice" \
            MEDIA_TAG=n ops/build-images.sh n
      - name: Версия N+1 — этот PR (с тестовой миграцией под нагрузкой)
        run: |
          pnpm install --frozen-lockfile
          APPS="api worker router realtime call-control connector-telegram connector-email web" MEDIA_TAG=n1 \
            EXTRA_MIGRATIONS_DIR=ops/zero-downtime-test/probe PREV_WEB_IMAGE=cc/web:n ops/build-images.sh n1
      # Компоненты, чьи известные дефекты версии N исправлены в Ф11, стартуют сразу версией N+1 — только пока базовая
      # ветка их не содержит (условие само перестаёт срабатывать после слияния):
      #  - Kamailio (класс C, обновляется отдельно в окно): dispatcher без DNS-кэша — иначе осушение Asterisk даёт 503;
      #  - worker: последовательная обработка входящих не держит 17 сообщ./с — хвост копится ещё до замены.
      - name: Стек версии N
        run: |
          grep -q use_dns_cache /tmp/base/mvp/infra/kamailio/kamailio.cfg || export KAMAILIO_TAG=n1
          grep -q INBOUND_CONCURRENCY /tmp/base/mvp/apps/worker/src/main.ts || export WORKER_TAG=n1
          echo "KAMAILIO_TAG=${KAMAILIO_TAG:-n}, WORKER_TAG=${WORKER_TAG:-n}"
          API_TAG=n MEDIA_TAG=n MOCK_TELEGRAM_TAG=n docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: cd e2e && pnpm exec playwright install --with-deps chromium
      # Линтер миграций и совместимость контрактов уже проверены задачей checks — предпроверка выпуска их не повторяет
      # (компилятор TypeScript на раннере отнимал CPU у стека под нагрузкой).
      # Клиент пишет раз в ~15 с (≈7 сообщ./с на 100 чатов): раннер (4 vCPU — весь стек, 10 Chromium, 30 разговоров)
      # при 6 с (17 сообщ./с) копил хвост и p50 > 5 с ещё до начала выпуска; нагрузка 6 с — в локальном прогоне.
      - name: Обновление N → N+1 под нагрузкой — 0 обрывов, 0 потерь и дублей, 0 разлогиненных, p99 < 5 с
        run: SKIP_COMPAT=1 MSG_EVERY_S=15 MEDIA_TAG=n1 MOCK_TELEGRAM_TAG=n node ops/zero-downtime-test/run.mjs n1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-downtime-report
          path: |
            mvp/out/zero-downtime-report.json
            mvp/out/releases/
          if-no-files-found: ignore
      - name: Итог автотеста и журналы (без журнала доступа Traefik)
        if: failure()
        run: |
          cat out/zero-downtime-report.json 2>/dev/null | head -c 20000 || true
          S=$(docker compose -f infra/compose/docker-compose.yml config --services | grep -vE '^(traefik|trunk-sim)$')
          docker compose -f infra/compose/docker-compose.yml logs --no-color $S | grep -v '"level":"debug"' | tail -300
